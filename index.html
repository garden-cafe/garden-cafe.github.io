<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garden — электронное меню</title>
<meta name="theme-color" content="#0a2417">
<style>html,body{margin:0;padding:0;background:#fbfbf8}body{-webkit-text-size-adjust:100%}</style>
</head>
<body>
<style id="garden-style">
/* =========================================================
   GARDEN — электронное меню
   Все стили изолированы внутри #garden-app
   ========================================================= */

#garden-app {
  --g-ink: #0c1a12;
  --g-ink-soft: #3c4c42;
  --g-muted: #7b8a80;
  --g-900: #0a2417;
  --g-800: #103321;
  --g-700: #17452c;
  --g-600: #1e5a38;
  --g-500: #2a7a4c;
  --g-400: #4d9a6c;
  --g-100: #e6f0e9;
  --g-50: #f2f7f3;
  --g-line: #e3eae4;
  --g-cream: #fbfbf8;
  --g-white: #ffffff;
  --g-red: #b4472f;
  --g-sans: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  --g-serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --g-shadow: 0 12px 40px rgba(10, 36, 23, 0.12);
  --g-r: 16px;

  position: relative;
  isolation: isolate;
  display: block;
  margin: 0;
  padding: 0;
  background: var(--g-cream);
  color: var(--g-ink);
  font-family: var(--g-sans);
  font-size: 16px;
  line-height: 1.4;
  font-weight: 400;
  text-align: left;
  letter-spacing: normal;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow: visible;
}

#garden-app *,
#garden-app *::before,
#garden-app *::after {
  box-sizing: border-box;
}

#garden-app h1,
#garden-app h2,
#garden-app h3,
#garden-app h4,
#garden-app p {
  margin: 0;
  padding: 0;
  color: inherit;
  font: inherit;
}

#garden-app img {
  display: block;
  max-width: 100%;
}

#garden-app button {
  appearance: none;
  -webkit-appearance: none;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: none;
  color: inherit;
  font: inherit;
  line-height: inherit;
  letter-spacing: inherit;
  text-align: inherit;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

#garden-app input,
#garden-app textarea,
#garden-app select {
  font-family: var(--g-sans);
  color: var(--g-ink);
}

#garden-app a {
  color: inherit;
  text-decoration: none;
}

#garden-app [hidden] {
  display: none !important;
}

#garden-app svg {
  display: block;
}

/* ---------- top bar ---------- */

#garden-app .g-topbar {
  position: sticky;
  top: 0;
  z-index: 70;
  background: rgba(251, 251, 248, 0.92);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--g-line);
}

#garden-app .g-topbar-in {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  max-width: 1320px;
  margin: 0 auto;
  padding: 9px 12px;
  min-height: 56px;
}

#garden-app .g-logo {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  flex: 0 0 auto;
}

#garden-app .g-logo-mark {
  width: 24px;
  height: 24px;
  color: var(--g-600);
}

#garden-app .g-logo-text {
  font-family: var(--g-serif);
  font-size: 24px;
  font-weight: 600;
  line-height: 1;
  letter-spacing: 0.02em;
}

#garden-app .g-searchfield {
  display: none;
  align-items: center;
  gap: 8px;
  height: 38px;
  padding: 0 12px;
  background: var(--g-white);
  border: 1px solid var(--g-line);
  border-radius: 999px;
}

#garden-app .g-searchfield svg {
  width: 16px;
  height: 16px;
  flex: 0 0 auto;
  color: var(--g-muted);
}

#garden-app .g-search-input {
  width: 100%;
  min-width: 0;
  height: 100%;
  padding: 0;
  border: 0;
  outline: none;
  background: transparent;
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

#garden-app .g-search-input::placeholder {
  color: var(--g-muted);
}

#garden-app .g-search-input::-webkit-search-cancel-button {
  display: none;
}

#garden-app .g-search-clear {
  display: none;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  flex: 0 0 auto;
  border-radius: 50%;
  background: var(--g-50);
  color: var(--g-ink-soft);
  font-size: 15px;
  line-height: 22px;
  text-align: center;
}

#garden-app .g-search-clear svg {
  width: 11px;
  height: 11px;
}

#garden-app .g-searchfield.has-value .g-search-clear,
#garden-app.is-searching .g-search-clear {
  display: flex;
}

#garden-app.is-searching .g-searchfield {
  display: flex;
  position: absolute;
  left: 10px;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 5;
  height: 40px;
  background: var(--g-white);
  box-shadow: 0 6px 24px rgba(10, 36, 23, 0.1);
}

#garden-app.is-searching .g-logo,
#garden-app.is-searching .g-actions {
  visibility: hidden;
}

#garden-app .g-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-left: auto;
  flex: 0 0 auto;
}

#garden-app .g-round {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  color: var(--g-ink);
  transition: background 0.18s ease;
}

#garden-app .g-round:active {
  background: var(--g-50);
}

#garden-app .g-round svg {
  width: 20px;
  height: 20px;
}

#garden-app .g-cart-button {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--g-800);
  color: #fff;
  transition: transform 0.18s ease, background 0.18s ease;
}

#garden-app .g-cart-button svg {
  width: 19px;
  height: 19px;
}

#garden-app .g-cart-button:active {
  transform: scale(0.94);
}

#garden-app .g-cart-count {
  position: absolute;
  top: -3px;
  right: -3px;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--g-500);
  border: 2px solid var(--g-cream);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  line-height: 14px;
  text-align: center;
  opacity: 0;
  transform: scale(0.6);
  transition: opacity 0.2s ease, transform 0.2s ease;
}

#garden-app .g-cart-count.is-on {
  opacity: 1;
  transform: scale(1);
}

/* ---------- hero ---------- */

#garden-app .g-hero {
  position: relative;
  margin: 12px;
  padding: 30px 22px 26px;
  border-radius: 22px;
  overflow: hidden;
  background:
    radial-gradient(120% 150% at 88% 8%, rgba(77, 154, 108, 0.28) 0%, rgba(77, 154, 108, 0) 55%),
    radial-gradient(90% 120% at 0% 100%, rgba(42, 122, 76, 0.22) 0%, rgba(42, 122, 76, 0) 60%),
    linear-gradient(155deg, #0d2c1c 0%, #0a2417 55%, #071c11 100%);
  color: #fff;
}

#garden-app .g-hero-leaf {
  position: absolute;
  right: -34px;
  top: -26px;
  width: 190px;
  height: 190px;
  color: rgba(255, 255, 255, 0.07);
  transform: rotate(12deg);
  pointer-events: none;
}

#garden-app .g-hero-in {
  position: relative;
  z-index: 2;
}

#garden-app .g-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
  padding: 5px 12px 5px 6px;
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.06);
  color: rgba(255, 255, 255, 0.78);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

#garden-app .g-eyebrow-dot {
  width: 18px;
  height: 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--g-500);
  color: #fff;
}

#garden-app .g-eyebrow-dot svg {
  width: 11px;
  height: 11px;
}

#garden-app .g-title {
  font-family: var(--g-serif);
  font-size: 56px;
  font-weight: 600;
  line-height: 0.92;
  letter-spacing: 0.005em;
}

#garden-app .g-tagline {
  margin-top: 8px;
  color: rgba(255, 255, 255, 0.66);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.24em;
  text-transform: uppercase;
}

#garden-app .g-hero-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 14px;
  margin-top: 22px;
  color: rgba(255, 255, 255, 0.8);
  font-size: 11.5px;
  font-weight: 500;
}

#garden-app .g-hero-meta span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

#garden-app .g-hero-meta svg {
  width: 14px;
  height: 14px;
  opacity: 0.6;
}

/* ---------- category chips ---------- */

#garden-app .g-chips-wrap {
  position: sticky;
  top: 56px;
  z-index: 60;
  margin-top: 2px;
  padding: 10px 0;
  background: linear-gradient(180deg, var(--g-cream) 70%, rgba(251, 251, 248, 0));
}

#garden-app .g-chips {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 1px 12px 3px;
  scrollbar-width: none;
  -ms-overflow-style: none;
  -webkit-overflow-scrolling: touch;
}

#garden-app .g-chips::-webkit-scrollbar {
  display: none;
}

#garden-app .g-chip {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 34px;
  padding: 0 14px;
  border: 1px solid var(--g-line);
  border-radius: 999px;
  background: var(--g-white);
  color: var(--g-ink-soft);
  font-size: 12.5px;
  font-weight: 600;
  white-space: nowrap;
  transition: background 0.16s ease, color 0.16s ease, border-color 0.16s ease;
}

#garden-app .g-chip-count {
  color: var(--g-muted);
  font-size: 10.5px;
  font-weight: 700;
}

#garden-app .g-chip.is-active {
  background: var(--g-800);
  border-color: var(--g-800);
  color: #fff;
}

#garden-app .g-chip.is-active .g-chip-count {
  color: rgba(255, 255, 255, 0.55);
}

/* ---------- menu ---------- */

#garden-app .g-menu {
  max-width: 1320px;
  margin: 0 auto;
  padding: 6px 12px 40px;
  min-height: 40vh;
}

#garden-app .g-sec {
  padding-top: 22px;
  scroll-margin-top: 110px;
}

#garden-app .g-sec:first-child {
  padding-top: 8px;
}

#garden-app .g-sec-head {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 12px;
}

#garden-app .g-sec-title {
  font-family: var(--g-serif);
  font-size: 26px;
  font-weight: 600;
  line-height: 1.1;
  letter-spacing: 0.005em;
  color: var(--g-ink);
}

#garden-app .g-sec-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 22px;
  height: 22px;
  padding: 0 7px;
  border-radius: 999px;
  background: var(--g-100);
  color: var(--g-700);
  font-size: 10.5px;
  font-weight: 800;
  transform: translateY(1px);
}

#garden-app .g-card-media-wrap {
  position: relative;
  display: block;
}

#garden-app .g-sec-line {
  flex: 1;
  height: 1px;
  background: var(--g-line);
}

#garden-app .g-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 9px 8px;
}

#garden-app .g-card {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  width: 100%;
  min-width: 0;
  text-align: left;
  border-radius: 14px;
  background: transparent;
  transition: transform 0.18s ease;
}

#garden-app .g-card:active {
  transform: scale(0.975);
}

#garden-app .g-card-media {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  aspect-ratio: 1 / 1;
  overflow: hidden;
  border-radius: 14px;
  background: linear-gradient(150deg, #17452c 0%, #0d2c1c 100%);
}

#garden-app .g-card-media::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(90% 70% at 75% 15%, rgba(255, 255, 255, 0.1), transparent 60%),
    radial-gradient(70% 70% at 15% 95%, rgba(77, 154, 108, 0.28), transparent 60%);
  pointer-events: none;
}

#garden-app .g-card-media::after {
  content: "";
  position: absolute;
  inset: 10%;
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 50%;
  pointer-events: none;
}

#garden-app .g-card-media.tone-2 {
  background: linear-gradient(150deg, #1e5a38 0%, #123a25 100%);
}

#garden-app .g-card-media.tone-3 {
  background: linear-gradient(150deg, #e8f1ea 0%, #d7e7db 100%);
}

#garden-app .g-card-media.tone-3::before {
  background: radial-gradient(90% 70% at 75% 15%, rgba(255, 255, 255, 0.55), transparent 62%);
}

#garden-app .g-card-media.tone-3::after {
  border-color: rgba(23, 69, 44, 0.14);
}

#garden-app .g-card-media.tone-4 {
  background: linear-gradient(150deg, #d9e9de 0%, #bcd8c5 100%);
}

#garden-app .g-card-media.tone-4::before {
  background: radial-gradient(90% 70% at 25% 15%, rgba(255, 255, 255, 0.5), transparent 65%);
}

#garden-app .g-card-media.tone-4::after {
  border-color: rgba(23, 69, 44, 0.16);
}

#garden-app .g-mono {
  position: relative;
  z-index: 2;
  font-family: var(--g-serif);
  font-size: clamp(30px, 11vw, 44px);
  font-weight: 600;
  line-height: 1;
  color: rgba(255, 255, 255, 0.88);
  user-select: none;
}

#garden-app .g-card-media.tone-3 .g-mono,
#garden-app .g-card-media.tone-4 .g-mono {
  color: rgba(23, 69, 44, 0.72);
}

#garden-app .g-card-img {
  position: absolute;
  inset: 0;
  z-index: 1;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#garden-app .g-card-badge {
  position: absolute;
  z-index: 3;
  left: 6px;
  top: 6px;
  max-width: calc(100% - 12px);
  padding: 3px 7px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.92);
  color: var(--g-800);
  font-size: 8.5px;
  font-weight: 800;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#garden-app .g-card-name {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  min-height: 2.5em;
  margin-top: 7px;
  color: var(--g-ink);
  font-size: 12px;
  font-weight: 600;
  line-height: 1.25;
  word-break: break-word;
}

#garden-app .g-card-price {
  margin-top: 3px;
  color: var(--g-600);
  font-size: 12px;
  font-weight: 800;
  line-height: 1.2;
  white-space: nowrap;
}

#garden-app .g-card-price small {
  color: var(--g-muted);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.02em;
}

/* ---------- empty / no results ---------- */

#garden-app .g-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 20px 60px;
  text-align: center;
}

#garden-app .g-empty-ico {
  width: 54px;
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--g-100);
  color: var(--g-600);
  margin-bottom: 14px;
}

#garden-app .g-empty-ico svg {
  width: 26px;
  height: 26px;
}

#garden-app .g-empty-title {
  font-family: var(--g-serif);
  font-size: 24px;
  font-weight: 600;
}

#garden-app .g-empty-text {
  max-width: 280px;
  margin-top: 6px;
  color: var(--g-muted);
  font-size: 13px;
  line-height: 1.5;
}

#garden-app .g-empty .g-btn {
  margin-top: 18px;
}

/* ---------- buttons ---------- */

#garden-app .g-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  height: 40px;
  padding: 0 18px;
  border: 1px solid var(--g-line);
  border-radius: 999px;
  background: var(--g-white);
  color: var(--g-ink);
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
  transition: background 0.16s ease, color 0.16s ease, border-color 0.16s ease, transform 0.16s ease;
}

#garden-app .g-btn:active {
  transform: scale(0.97);
}

#garden-app .g-btn svg {
  width: 16px;
  height: 16px;
}

#garden-app .g-btn-primary {
  background: var(--g-800);
  border-color: var(--g-800);
  color: #fff;
}

#garden-app .g-btn-ghost {
  background: transparent;
  border-color: transparent;
  color: var(--g-ink-soft);
}

#garden-app .g-btn-block {
  width: 100%;
}

#garden-app .g-btn[disabled] {
  opacity: 0.45;
  pointer-events: none;
}

/* ---------- footer ---------- */

#garden-app .g-footer {
  max-width: 1320px;
  margin: 0 auto;
  padding: 26px 16px 110px;
  text-align: center;
  color: var(--g-muted);
  font-size: 11px;
  line-height: 1.6;
}

#garden-app .g-footer-brand {
  font-family: var(--g-serif);
  font-size: 17px;
  letter-spacing: 0.08em;
  color: var(--g-ink-soft);
  text-transform: uppercase;
}

#garden-app .g-footer-owner {
  margin-top: 8px;
  text-decoration: underline;
  text-decoration-color: rgba(123, 138, 128, 0.4);
  text-underline-offset: 3px;
  font-size: 10.5px;
}

/* ---------- cart bar ---------- */

#garden-app .g-cartbar {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  z-index: 65;
  display: flex;
  align-items: center;
  gap: 12px;
  width: auto;
  max-width: 520px;
  margin: 0 auto;
  padding: 10px 10px 10px 16px;
  border-radius: 16px;
  background: var(--g-800);
  color: #fff;
  box-shadow: 0 14px 40px rgba(8, 29, 19, 0.32);
  transform: translateY(140%);
  opacity: 0;
  transition: transform 0.32s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s ease;
  pointer-events: none;
}

#garden-app .g-cartbar.is-on {
  transform: translateY(0);
  opacity: 1;
  pointer-events: auto;
}

#garden-app .g-cartbar-count {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 32px;
  height: 32px;
  padding: 0 8px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.12);
  font-size: 13px;
  font-weight: 800;
}

#garden-app .g-cartbar-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
  flex: 1;
}

#garden-app .g-cartbar-title {
  font-size: 13px;
  font-weight: 700;
  line-height: 1.2;
}

#garden-app .g-cartbar-sum {
  color: rgba(255, 255, 255, 0.62);
  font-size: 11px;
  font-weight: 500;
  line-height: 1.3;
}

#garden-app .g-cartbar-go {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 38px;
  padding: 0 14px;
  border-radius: 11px;
  background: var(--g-400);
  color: #fff;
  font-size: 12px;
  font-weight: 800;
  white-space: nowrap;
}

#garden-app .g-cartbar-go svg {
  width: 15px;
  height: 15px;
}

/* ---------- overlay + sheets ---------- */

#garden-app .g-layer {
  position: fixed;
  inset: 0;
  z-index: 400;
  display: none;
}

#garden-app .g-layer.is-open {
  display: block;
}

#garden-app .g-backdrop {

<script>
/* =========================================================
   GARDEN — движок электронного меню
   Всё живёт внутри одной функции gardenBoot(), чтобы страницу
   можно было целиком скачать одним файлом index.html вместе с данными.
   ========================================================= */

function gardenBoot() {
  "use strict";

  var ROOT = document.getElementById("garden-app");
  if (!ROOT || ROOT.getAttribute("data-booted") === "1") return;
  ROOT.setAttribute("data-booted", "1");

  var EMBEDDED = window.GARDEN_DATA;
  if (!EMBEDDED || !EMBEDDED.dishes) return;

  var LS_DATA = "garden.menu.v2";
  var LS_CART = "garden.cart.v2";
  var LS_TABLE = "garden.table.v1";
  var SS_OWNER = "garden.owner.v1";

  var layer = null;
  var menuEl = null;
  var chipsEl = null;
  var cartbar = null;
  var toastEl = null;
  var ownerHost = null;
  var toastTimer = null;

  var ui = {
    q: "",
    cat: "all",
    sheet: null,
    dish: null,
    owner: false,
    ownerTab: "dishes",
    ownerQ: "",
    edit: null,
    confirm: null
  };

  var DATA = loadData();
  var cart = loadCart();

  /* ---------------- утилиты ---------------- */

  function clone(v) {
    return JSON.parse(JSON.stringify(v));
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (m) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
    });
  }

  function uid(prefix) {
    return (prefix || "id") + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  }

  function readJSON(key) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function writeJSON(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (e) {
      toast("Не хватает памяти браузера. Удалите большие фото или используйте ссылки.");
      return false;
    }
  }

  function plural(n, one, few, many) {
    var a = Math.abs(n) % 100;
    var b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b > 1 && b < 5) return few;
    if (b === 1) return one;
    return many;
  }

  function money(n) {
    var v = Math.round(Number(n) || 0);
    return v.toLocaleString("ru-RU").replace(/\u00A0/g, " ") + " " + (DATA.brand.currency || "₽");
  }

  function initial(name) {
    var s = String(name || "").replace(/[«»"']/g, "").trim();
    return (s.charAt(0) || "G").toUpperCase();
  }

  function catName(id) {
    var c = DATA.categories.find(function (x) { return x.id === id; });
    return c ? c.name : "Без раздела";
  }

  function catIndex(id) {
    var i = DATA.categories.findIndex(function (x) { return x.id === id; });
    return i < 0 ? 0 : i;
  }

  function dishById(id) {
    return DATA.dishes.find(function (d) { return d.id === id; }) || null;
  }

  function toast(text) {
    if (!toastEl) return;
    toastEl.textContent = text;
    toastEl.classList.add("is-on");
    if (toastTimer) clearTimeout(toastTimer);

      toastEl.classList.remove("is-on");

  function lockScroll() {
    document.documentElement.classList.add("garden-lock");

  /* ---------------- данные ---------------- */

  function normalize(d) {
    if (!d || !Array.isArray(d.dishes) || !Array.isArray(d.categories)) return null;

    var b = d.brand || {};
    d.brand = {
      name: b.name || "Garden",
      tagline: b.tagline || "кофе · кухня · бар",
      subtitle: b.subtitle || "электронное меню",
      hours: b.hours || "10:00 — 23:00",
      address: b.address || "",
      phone: b.phone || "",
      whatsapp: b.whatsapp || "",
      currency: b.currency || "₽",
      pin: b.pin == null ? "1234" : String(b.pin),
      note: b.note || "Покажите собранный заказ официанту — он всё принесёт.",
      instagram: b.instagram || ""

    d.categories = d.categories
      .filter(function (c) { return c && c.id && c.name; })
      .map(function (c) { return { id: String(c.id), name: String(c.name) }; });

    if (!d.categories.length) {
      d.categories = [{ id: "menu", name: "Меню" }];
    }

    d.dishes = d.dishes
      .filter(function (x) { return x && x.id && x.name; })
      .map(function (x) {
        return {
          id: String(x.id),
          cat: String(x.cat || d.categories[0].id),
          name: String(x.name),
          price: Math.max(0, Number(x.price) || 0),
          desc: x.desc ? String(x.desc) : "",
          image: x.image ? String(x.image) : "",
          badge: x.badge ? String(x.badge) : "",
          hidden: !!x.hidden,
          sizes: Array.isArray(x.sizes)
            ? x.sizes.filter(function (s) { return s && s.label; }).map(function (s) {
                return { label: String(s.label), extra: Math.max(0, Number(s.extra) || 0) };
              })
            : [],
          addons: Array.isArray(x.addons)
            ? x.addons.filter(function (a) { return a && a.label; }).map(function (a) {
                return {
                  group: a.group ? String(a.group) : "Добавки",
                  label: String(a.label),
                  price: Math.max(0, Number(a.price) || 0)
                };
              })
            : []
        };
      });

    d.updatedAt = Number(d.updatedAt) || 0;
    return d;
  }

  function loadData() {
    var base = normalize(clone(EMBEDDED));
    var local = readJSON(LS_DATA);
    if (local && Number(local.updatedAt) > Number(base.updatedAt)) {
      var fixed = normalize(local);
      if (fixed) return fixed;
    }
    return base;
  }

  function saveData() {
    DATA.updatedAt = Date.now();
    writeJSON(LS_DATA, DATA);
  }

  function loadCart() {
    var raw = readJSON(LS_CART);
    if (!Array.isArray(raw)) return [];
    return raw
      .filter(function (i) {
        return i && i.key && i.name && i.qty > 0;
      })
      .map(function (i) {
        return {
          key: String(i.key),
          id: String(i.id || ""),
          name: String(i.name),
          price: Math.max(0, Number(i.price) || 0),
          qty: Math.max(1, Math.min(99, Number(i.qty) || 1)),
          size: i.size ? String(i.size) : "",
          extras: Array.isArray(i.extras) ? i.extras : [],
          image: i.image ? String(i.image) : "",
          cat: i.cat ? String(i.cat) : ""

  }

    gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.1 2.1-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.2h-3v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1L6 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H4.7v-3h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9L6 8l2.1-2.1.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5v-.2h3v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.4 8l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.2v3h-.2a1.7 1.7 0 0 0-1.1 1Z"/></svg>'

  function renderShell() {

  function mediaHtml(dish, cls) {
    var tone = "tone-" + ((catIndex(dish.cat) % 4) + 1);
    if (dish.image) {
      return '<div class="' + cls + ' ' + tone + '"><img class="g-card-img" src="' + esc(dish.image) + '" alt="' + esc(dish.name) + '" loading="lazy"><span class="g-mono" hidden>' + esc(initial(dish.name)) + '</span></div>';
    }
    return '<div class="' + cls + ' ' + tone + '"><span class="g-mono">' + esc(initial(dish.name)) + '</span></div>';
  }

  function cardHtml(d) {
    var from = d.sizes.some(function (s) { return s.extra > 0; });
    var price = (from ? '<small>от </small>' : "") + money(d.price);
    return '<div class="g-card" role="button" tabindex="0" data-dish="' + esc(d.id) + '" aria-label="' + esc(d.name + ", " + money(d.price)) + '">' +
      '<div class="g-card-media-wrap">' + mediaHtml(d, "g-card-media") +
        (d.badge ? '<span class="g-card-badge">' + esc(d.badge) + '</span>' : "") +
      '</div>' +
      '<div class="g-card-name">' + esc(d.name) + '</div>' +
      '<div class="g-card-price">' + price + '</div>' +

  function renderMenu() {
    var list = visibleDishes();
    if (!list.length) {
      menuEl.innerHTML =
        '<div class="g-empty">' +
          '<div class="g-empty-ico">' + IC.search + '</div>' +
          '<h3 class="g-empty-title">Ничего не нашлось</h3>' +
          '<p class="g-empty-text">Попробуйте другое название или сбросьте фильтры — в меню ' + DATA.dishes.filter(function (d) { return !d.hidden; }).length + ' позиций.</p>' +
          '<button class="g-btn" data-act="reset-filters">Показать всё меню</button>' +
        '</div>';

      html += '<section class="g-sec">' +
        '<div class="g-sec-head">' +
          '<h2 class="g-sec-title">' + esc(g.cat.name) + '</h2>' +
          '<span class="g-sec-count">' + g.items.length + '</span>' +
          '<span class="g-sec-line"></span>' +
        '</div>' +
        '<div class="g-grid">' + g.items.map(cardHtml).join("") + '</div>' +
      '</section>';

  function cartCount() {
    return cart.reduce(function (s, i) { return s + i.qty; }, 0);
  }

  function cartSum() {
    return cart.reduce(function (s, i) { return s + i.qty * i.price; }, 0);
  }

  function renderCart() {
    var n = cartCount();
    var sum = cartSum();
    var badge = ROOT.querySelector("[data-cart-count]");
    badge.textContent = n > 99 ? "99+" : String(n);
    badge.classList.toggle("is-on", n > 0);

    ROOT.querySelector("[data-cartbar-count]").textContent = n;
    ROOT.querySelector("[data-cartbar-sum]").textContent = n
      ? plural(n, "1 позиция", n + " позиции", n + " позиций") + " · " + money(sum)
      : "";
    cartbar.classList.toggle("is-on", n > 0);
  }

  /* ---------------- слой / шторки ---------------- */

  function openLayer(html) {
    layer.innerHTML = '<div class="g-backdrop" data-act="close-sheet"></div>' + html;
    layer.classList.add("is-open");
    lockScroll();
  }

  function closeLayer() {
    if (!layer) return;
    layer.classList.remove("is-open");
    layer.innerHTML = "";
    ui.sheet = null;
    ui.dish = null;
    unlockScroll();
  }

  function closeSearch() {
    ROOT.classList.remove("is-searching");
  }

    ROOT.classList.add("is-searching");

  /* ---------------- карточка блюда ---------------- */

  function dishUnit(d) {
    if (!ui.dish) return d.price;
    var s = d.sizes[ui.dish.size];
    var unit = d.price + (s ? s.extra : 0);
    Object.keys(ui.dish.addons).forEach(function (k) {
      if (ui.dish.addons[k] && d.addons[k]) unit += d.addons[k].price;
    });
    return unit;
  }

  function refreshDishTotal() {
    if (!ui.dish) return;
    var d = ui.dish.dish;
    var el = layer.querySelector("[data-add-total]");
    if (el) el.textContent = "В корзину · " + money(dishUnit(d) * ui.dish.qty);
    var q = layer.querySelector("[data-dish-qty]");
    if (q) q.textContent = ui.dish.qty;
    var minus = layer.querySelector('[data-act="dish-qty"][data-d="-1"]');
    if (minus) minus.disabled = ui.dish.qty <= 1;
  }

  function openDish(id) {
    var d = dishById(id);
    if (!d) return;
    ui.sheet = "dish";
    ui.dish = { dish: d, size: 0, addons: {}, qty: 1 };

    var media = mediaHtml(d, "g-dish-media");
    if (d.badge) {
      media = media.replace("</div>", '<span class="g-card-badge">' + esc(d.badge) + "</span></div>");
    }

    var sizes = "";
    if (d.sizes.length) {
      sizes = '<div class="g-group"><div class="g-group-title">Объём <span>выберите один</span></div><div class="g-opts">' +
        d.sizes.map(function (s, i) {
          return '<button class="g-opt' + (i === 0 ? " is-active" : "") + '" data-act="size" data-i="' + i + '">' + esc(s.label) + (s.extra ? ' <small>+' + money(s.extra) + '</small>' : "") + '</button>';
        }).join("") +
      '</div></div>';
    }

    var addons = "";
    var seen = [];
    d.addons.forEach(function (a) {
      if (seen.indexOf(a.group) !== -1) return;
      seen.push(a.group);
      var items = d.addons.map(function (x, i) { return { x: x, i: i }; }).filter(function (o) { return o.x.group === a.group; });
      addons += '<div class="g-group"><div class="g-group-title">' + esc(a.group) + ' <span>можно несколько</span></div><div class="g-opts">' +
        items.map(function (o) {
          return '<button class="g-opt" data-act="addon" data-i="' + o.i + '">' + esc(o.x.label) + (o.x.price ? ' <small>+' + money(o.x.price) + '</small>' : ' <small>бесплатно</small>') + '</button>';
        }).join("") +
      '</div></div>';
    });

    var html =
      '<div class="g-sheet" role="dialog" aria-modal="true" aria-label="' + esc(d.name) + '">' +
        '<div class="g-sheet-grab"></div>' +
        '<button class="g-sheet-close" data-act="close-sheet" aria-label="Закрыть">' + IC.close + '</button>' +
        '<div class="g-sheet-scroll">' +
          media +
          '<div class="g-sheet-pad">' +
            '<h2 class="g-dish-title">' + esc(d.name) + '</h2>' +
            (d.desc ? '<p class="g-dish-desc">' + esc(d.desc) + '</p>' : "") +
            '<div class="g-dish-price"><strong>' + money(d.price) + '</strong>' + (d.sizes.some(function (s) { return s.extra > 0; }) ? '<span>цена за базовый объём</span>' : "") + '</div>' +
            sizes + addons +
          '</div>' +
        '</div>' +
        '<div class="g-sheet-foot">' +
          '<div class="g-stepper">' +
            '<button data-act="dish-qty" data-d="-1" aria-label="Меньше" disabled>−</button>' +
            '<span class="g-stepper-val" data-dish-qty>1</span>' +
            '<button data-act="dish-qty" data-d="1" aria-label="Больше">+</button>' +
          '</div>' +
          '<button class="g-add-btn" data-act="add-cart"><span data-add-total>В корзину · ' + money(d.price) + '</span></button>' +
        '</div>' +
      '</div>';

    openLayer(html);
    refreshDishTotal();
  }

  function addCurrentToCart() {
    if (!ui.dish) return;
    var d = ui.dish.dish;
    var size = d.sizes[ui.dish.size] || null;
    var extras = [];
    Object.keys(ui.dish.addons).forEach(function (k) {
      if (ui.dish.addons[k] && d.addons[k]) {
        extras.push({ label: d.addons[k].label, price: d.addons[k].price, group: d.addons[k].group });
      }
    });
    var key = d.id + "|" + (size ? size.label : "") + "|" + extras.map(function (e) { return e.label; }).sort().join(",");
    var found = cart.find(function (i) { return i.key === key; });
    if (found) {
      found.qty = Math.min(99, found.qty + ui.dish.qty);
    } else {
      cart.unshift({
        key: key,
        id: d.id,
        name: d.name,
        price: dishUnit(d),
        qty: ui.dish.qty,
        size: size ? size.label : "",
        extras: extras,
        image: d.image,
        cat: d.cat
      });
    }
    saveCart();
    renderCart();
    closeLayer();
    toast("Добавлено: " + d.name);
  }

  /* ---------------- корзина ---------------- */

  function orderText() {
    var lines = [];
    var n = cartCount();
    lines.push(DATA.brand.name + " · заказ");
    var table = (readJSON(LS_TABLE) || {}).table || "";
    if (table) lines.push("Столик: " + table);
    lines.push("");
    cart.forEach(function (i) {
      var title = i.name + (i.size ? " (" + i.size + ")" : "");
      lines.push(i.qty + " × " + title + " — " + money(i.price * i.qty));
      if (i.extras && i.extras.length) {
        lines.push("   + " + i.extras.map(function (e) { return e.label; }).join(", "));
      }
    });
    lines.push("");
    lines.push("Итого: " + money(cartSum()) + " · " + plural(n, "1 позиция", n + " позиции", n + " позиций"));
    return lines.join("\n");
  }

  function copyText(text) {
    var done = function () { toast("Скопировано"); };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }
    function fallback() {
      try {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        done();
      } catch (e) {
        toast("Не удалось скопировать. Выделите текст вручную.");
      }
    }
  }

              '<button data-act="cart-qty" data-key="' + esc(i.key) + '" data-d="-1" aria-label="Меньше">−</button>' +

        '</div>' +
      '</div>';
    }).join("");

    var wa = String(DATA.brand.whatsapp || "").replace(/\D/g, "");
    var primary = wa
      ? '<button class="g-btn g-btn-primary" data-act="wa-order">' + IC.wa + ' WhatsApp</button>'
      : '<button class="g-btn g-btn-primary" data-act="copy-order">' + IC.copy + ' Скопировать</button>';
    var secondary = wa
      ? '<button class="g-btn" data-act="copy-order">' + IC.copy + ' Скопировать</button>'
      : '<button class="g-btn" data-act="close-sheet">Показать официанту</button>';

    html =
      '<div class="g-sheet g-sheet-cart" role="dialog" aria-modal="true" aria-label="Корзина">' +
        '<div class="g-sheet-grab"></div>' +
        '<div class="g-sheet-head">' +
          '<h2>Корзина</h2>' +
          '<span class="g-sheet-count">' + plural(cartCount(), "1 позиция", cartCount() + " позиции", cartCount() + " позиций") + '</span>' +
          '<button class="g-sheet-close" data-act="close-sheet" aria-label="Закрыть">' + IC.close + '</button>' +
        '</div>' +
        '<div class="g-sheet-scroll">' +
          '<div class="g-cart-list">' + items + '</div>' +
          '<div class="g-cart-tools">' +
            '<label class="g-field"><span>Номер столика — необязательно</span><input class="g-input" data-table type="text" inputmode="numeric" placeholder="Например, 5" value="' + esc(table) + '"></label>' +
            '<p class="g-cart-note">' + esc(DATA.brand.note) + '</p>' +
          '</div>' +
        '</div>' +
        '<div class="g-sheet-foot g-cart-foot">' +
          '<div class="g-total"><span>Итого</span><strong>' + money(cartSum()) + '</strong></div>' +
          '<div class="g-cart-actions">' + secondary + primary + '</div>' +

        '</div>' +

    layer.innerHTML = '<div class="g-backdrop" data-act="close-sheet"></div>' + html;
  }

  function openCart() {
    ui.sheet = "cart";
    paintCartSheet();
    layer.classList.add("is-open");
    lockScroll();

  /* ================= РЕЖИМ ВЛАДЕЛЬЦА ================= */

  function openOwner() {
    var unlocked = false;
    try { unlocked = sessionStorage.getItem(SS_OWNER) === "1"; } catch (e) {}
    if (DATA.brand.pin && !unlocked) {
      openPin();
      return;
    }
    ui.owner = true;
    ui.edit = null;
    renderOwner();
    lockScroll();
  }

  function closeOwner() {
    ui.owner = false;
    ui.edit = null;
    ownerHost.innerHTML = "";
    unlockScroll();
  }

  function renderOwner() {
    if (!ui.owner) return;
    var tabs = [
      { id: "dishes", name: "Блюда" },
      { id: "categories", name: "Разделы" },
      { id: "settings", name: "Настройки" },
      { id: "data", name: "Публикация" }

      return '<button class="g-tab' + (ui.ownerTab === t.id ? " is-active" : "") + '" data-act="owner-tab" data-tab="' + t.id + '">' + t.name + '</button>';

  function readDishForm() {
    var f = ownerHost.querySelector("[data-dish-form]");
    if (!f || !ui.edit) return;
    var e = ui.edit;
    var val = function (name) {
      var el = f.querySelector('[name="' + name + '"]');
      return el ? el.value : "";
    };
    e.name = val("name").trim();
    e.price = Math.max(0, Number(val("price")) || 0);
    e.cat = val("cat") || e.cat;
    e.desc = val("desc").trim();
    e.image = val("image").trim();
    e.badge = val("badge").trim();
    var hidden = f.querySelector('[name="hidden"]');
    e.hidden = !!(hidden && hidden.checked);

    e.sizes = [];
    f.querySelectorAll("[data-size-row]").forEach(function (row) {
      var label = row.querySelector("[data-size-label]").value.trim();
      var extra = Math.max(0, Number(row.querySelector("[data-size-extra]").value) || 0);
      if (label) e.sizes.push({ label: label, extra: extra });
    });

    e.addons = [];
    f.querySelectorAll("[data-addon-row]").forEach(function (row) {
      var label = row.querySelector("[data-addon-label]").value.trim();
      var group = row.querySelector("[data-addon-group]").value.trim() || "Добавки";
      var price = Math.max(0, Number(row.querySelector("[data-addon-price]").value) || 0);
      if (label) e.addons.push({ group: group, label: label, price: price });
    });
  }

  function saveDish() {
    readDishForm();
    var e = ui.edit;
    if (!e.name) { toast("Введите название блюда"); return; }
    if (!e.cat) e.cat = (DATA.categories[0] || {}).id;

    var dish = {
      id: e.id || uid("dish"),
      cat: e.cat,
      name: e.name,
      price: e.price,
      desc: e.desc,
      image: e.image,
      badge: e.badge,
      hidden: e.hidden,
      sizes: e.sizes,
      addons: e.addons
    };

    if (e.isNew) {
      var last = -1;
      DATA.dishes.forEach(function (x, i) { if (x.cat === dish.cat) last = i; });
      if (last >= 0) DATA.dishes.splice(last + 1, 0, dish);
      else DATA.dishes.push(dish);
    } else {
      var idx = DATA.dishes.findIndex(function (x) { return x.id === dish.id; });
      if (idx >= 0) DATA.dishes[idx] = dish;
    }

    saveData();
    ui.edit = null;
    renderAll();
    paintOwnerBody();
    toast("Блюдо сохранено");
  }

  function copyDish(id) {
    var src = dishById(id);
    if (!src) return;
    var idx = DATA.dishes.findIndex(function (x) { return x.id === id; });
    var copy = clone(src);
    copy.id = uid("dish");
    copy.name = src.name + " (копия)";
    DATA.dishes.splice(idx + 1, 0, copy);
    saveData();
    renderAll();
    paintOwnerBody();
    toast("Карточка скопирована");
  }

  function deleteDish(id) {
    var d = dishById(id);
    if (!d) return;
    askConfirm("Удалить блюдо?", "«" + d.name + "» исчезнет из меню. Это действие нельзя отменить.", "Удалить", function () {
      DATA.dishes = DATA.dishes.filter(function (x) { return x.id !== id; });
      saveData();
      ui.edit = null;
      renderAll();
      paintOwnerBody();
      toast("Блюдо удалено");
    }, true);
  }

  function moveDish(id, dir) {
    var idx = DATA.dishes.findIndex(function (x) { return x.id === id; });
    if (idx < 0) return;
    var cat = DATA.dishes[idx].cat;
    var positions = [];
    DATA.dishes.forEach(function (x, i) { if (x.cat === cat) positions.push(i); });
    var pos = positions.indexOf(idx);
    var target = positions[pos + dir];
    if (target == null) return;
    var tmp = DATA.dishes[target];
    DATA.dishes[target] = DATA.dishes[idx];
    DATA.dishes[idx] = tmp;
    saveData();
    renderAll();
    paintDishList();
  }

  function download(filename, text, type) {
    try {
      var blob = new Blob([text], { type: type || "text/html;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        URL.revokeObjectURL(url);
        a.remove();
      }, 600);
    } catch (e) {
      toast("Не удалось скачать файл");
    }
  }

  function exportJSON() {
    download("garden-menu.json", JSON.stringify(DATA, null, 2), "application/json;charset=utf-8");
    toast("Файл с данными скачан");
  }

  function importJSON() {
    var input = document.createElement("input");
    input.type = "file";
    input.accept = ".json,application/json";
    input.style.display = "none";
    document.body.appendChild(input);
    input.addEventListener("change", function () {
      var file = input.files && input.files[0];
      if (!file) { input.remove(); return; }
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var parsed = normalize(JSON.parse(String(reader.result)));
          if (!parsed) throw new Error("bad");
          DATA = parsed;
          saveData();
          renderAll();
          paintOwnerBody();
          toast("Данные загружены");
        } catch (e) {
          toast("Не удалось прочитать JSON");
        }
        input.remove();
      };
      reader.readAsText(file);
    });
    input.click();
  }

          '<h3>Вход для владельца</h3>' +
          '<p>' + esc(hint) + '</p>' +
          '<input class="g-input" data-pin-input type="tel" inputmode="numeric" maxlength="8" placeholder="••••" aria-label="PIN">' +
          '<div class="g-pin-err" data-pin-err hidden>Неверный PIN</div>' +
          '<button class="g-btn g-btn-primary" data-act="pin-ok">Войти</button>' +
        '</div>' +
      '</div>'
    );
    setTimeout(function () {
      var el = layer.querySelector("[data-pin-input]");
      if (el) el.focus();
    }, 80);
  }

  function tryPin() {
    var el = layer.querySelector("[data-pin-input]");
    var err = layer.querySelector("[data-pin-err]");
    if (!el) return;
    if (el.value.trim() === DATA.brand.pin) {
      try { sessionStorage.setItem(SS_OWNER, "1"); } catch (e) {}
      closeLayer();
      setTimeout(openOwner, 40);
    } else {
      if (err) err.hidden = false;
      el.value = "";
      el.focus();
    }
  }

  /* ---------------- события ---------------- */

  function scrollToMenuStart() {
    var m = ROOT.querySelector(".g-menu");
    if (!m) return;
    var y = m.getBoundingClientRect().top + window.pageYOffset - 112;
    if (window.pageYOffset > y) {
      window.scrollTo({ top: y, behavior: "smooth" });
    }
  }

  function closeSearch() {
    ROOT.classList.remove("is-searching");
    var input = ROOT.querySelector(".g-search-input");
    if (input && input.value) {
      input.value = "";
      ui.q = "";
      var sf = ROOT.querySelector("[data-searchfield]");
      if (sf) sf.classList.remove("has-value");
      renderChips();
      renderMenu();
    }
  }

  function onClick(e) {
    var card = e.target.closest ? e.target.closest("[data-dish]") : null;
    if (card && ROOT.contains(card)) {
      openDish(card.getAttribute("data-dish"));
      return;
    }

    var el = e.target.closest ? e.target.closest("[data-act]") : null;
    if (!el || !ROOT.contains(el)) return;
    var act = el.getAttribute("data-act");
    var i;

    switch (act) {
      case "home":
        closeSearch();
        window.scrollTo({ top: 0, behavior: "smooth" });
        break;

      case "open-search":
        openSearch();
        break;

      case "clear-search": {
        var input = ROOT.querySelector(".g-search-input");
        if (input && input.value) {
          input.value = "";
          ui.q = "";
          var sf = ROOT.querySelector("[data-searchfield]");
          if (sf) sf.classList.remove("has-value");
          renderChips();
          renderMenu();
        } else {
          closeSearch();
        }
        break;
      }

      case "cat": {
        var cat = el.getAttribute("data-cat");
        ui.cat = cat;
        ui.q = "";
        var si = ROOT.querySelector(".g-search-input");
        if (si) si.value = "";
        var sf2 = ROOT.querySelector("[data-searchfield]");
        if (sf2) sf2.classList.remove("has-value");
        closeSearch();
        renderChips();
        renderMenu();
        scrollToMenuStart();
        break;
      }

      case "reset-filters":
        ui.cat = "all";
        ui.q = "";
        var si2 = ROOT.querySelector(".g-search-input");
        if (si2) si2.value = "";
        renderChips();
        renderMenu();
        break;

      case "open-cart":
        openCart();
        break;

      case "close-sheet":
        closeLayer();
        break;

      case "size":
        if (!ui.dish) break;
        ui.dish.size = Number(el.getAttribute("data-i")) || 0;
        layer.querySelectorAll('[data-act="size"]').forEach(function (b) {
          b.classList.toggle("is-active", b === el);
        });
        refreshDishTotal();
        break;

      case "addon":
        if (!ui.dish) break;
        i = el.getAttribute("data-i");
        ui.dish.addons[i] = !ui.dish.addons[i];
        el.classList.toggle("is-active", !!ui.dish.addons[i]);
        refreshDishTotal();
        break;

      case "dish-qty":
        if (!ui.dish) break;
        ui.dish.qty = Math.max(1, Math.min(99, ui.dish.qty + Number(el.getAttribute("data-d"))));
        refreshDishTotal();
        break;

      case "add-cart":
        addCurrentToCart();
        break;

      case "cart-qty": {
        var key = el.getAttribute("data-key");
        var d = Number(el.getAttribute("data-d"));
        var item = cart.find(function (x) { return x.key === key; });
        if (!item) break;
        item.qty += d;
        if (item.qty <= 0) cart = cart.filter(function (x) { return x.key !== key; });
        saveCart();
        renderCart();
        var sc = layer.querySelector(".g-sheet-scroll");
        var st = sc ? sc.scrollTop : 0;
        paintCartSheet();
        var sc2 = layer.querySelector(".g-sheet-scroll");
        if (sc2) sc2.scrollTop = st;
        break;
      }

      case "cart-remove":
        cart = cart.filter(function (x) { return x.key !== el.getAttribute("data-key"); });
        saveCart();
        renderCart();
        paintCartSheet();
        break;

      case "cart-clear":
        askConfirm("Очистить корзину?", "Все выбранные блюда исчезнут.", "Очистить", function () {
          cart = [];
          saveCart();
          renderCart();
          setTimeout(openCart, 60);
        }, true);
        break;

      case "copy-order":
        if (!cart.length) break;
        copyText(orderText());
        break;

      case "wa-order": {
        var digits = String(DATA.brand.whatsapp || "").replace(/\D/g, "");
        if (!digits) { toast("Добавьте номер WhatsApp в настройках"); break; }
        window.open("https://wa.me/" + digits + "?text=" + encodeURIComponent(orderText()), "_blank");
        break;
      }

      case "owner":
        openOwner();
        break;

      case "pin-ok":
        tryPin();
        break;

      case "owner-close":
        closeOwner();
        break;

      case "owner-tab":
        ui.ownerTab = el.getAttribute("data-tab");
        ui.edit = null;
        renderOwner();
        break;

      case "owner-add-dish":
        startEdit(null);
        break;

      case "owner-edit":
        startEdit(el.getAttribute("data-id"));
        break;

      case "owner-copy":
        copyDish(el.getAttribute("data-id"));
        break;

      case "owner-del":
        deleteDish(el.getAttribute("data-id"));
        break;

      case "dish-move":
        moveDish(el.getAttribute("data-id"), Number(el.getAttribute("data-d")));
        break;

      case "dish-save":
        saveDish();
        break;

      case "dish-cancel":
        ui.edit = null;
        paintOwnerBody();
        break;

      case "dish-delete":
        if (ui.edit && ui.edit.id) deleteDish(ui.edit.id);
        break;

      case "size-add":
        readDishForm();
        if (ui.edit) { ui.edit.sizes.push({ label: "", extra: 0 }); paintOwnerBody(); }
        break;

      case "size-del":
        readDishForm();
        if (ui.edit) { ui.edit.sizes.splice(Number(el.getAttribute("data-i")), 1); paintOwnerBody(); }
        break;

      case "addon-add":
        readDishForm();
        if (ui.edit) { ui.edit.addons.push({ group: "Добавки", label: "", price: 0 }); paintOwnerBody(); }
        break;

      case "addon-del":
        readDishForm();
        if (ui.edit) { ui.edit.addons.splice(Number(el.getAttribute("data-i")), 1); paintOwnerBody(); }
        break;

      case "cat-add":
        addCategory();
        break;

      case "cat-del":
        deleteCategory(el.getAttribute("data-id"));
        break;

      case "cat-move":
        moveCategory(el.getAttribute("data-id"), Number(el.getAttribute("data-d")));
        break;

      case "brand-save":
        saveBrand();
        break;

      case "img-clear":
        readDishForm();
        if (ui.edit) { ui.edit.image = ""; paintOwnerBody(); }
        break;

      case "publish-copy": {
        var code = buildPageHtml();
        if (code) {
          copyText(code);
          setTimeout(function () {
            toast("Код страницы скопирован (index.html)");
          }, 120);
        }
        break;
      }

      case "publish-download": {
        var page = buildPageHtml();
        if (page) {
          download("index.html", page);
          toast("Файл index.html скачан — загрузите его в репозиторий на GitHub");
        }
        break;
      }

      case "export-json":
        exportJSON();
        break;

      case "import-json":
        importJSON();
        break;

      case "reset-data":
        resetData();
        break;

      case "confirm-yes": {
        var cb = ui.confirm;
        ui.confirm = null;
        closeLayer();
        if (cb) cb();
        break;
      }

      case "confirm-no":
        ui.confirm = null;
        closeLayer();
        break;

      default:
        break;
    }
  }

  function onInput(e) {
    var t = e.target;

    if (t.matches("[data-search-input]")) {
      ui.q = t.value;
      var sf = ROOT.querySelector("[data-searchfield]");
      if (sf) sf.classList.toggle("has-value", !!t.value);
      if (ui.q && ui.cat !== "all") {
        ui.cat = "all";
        renderChips();
      }
      renderMenu();
      if (ui.q) scrollToMenuStart();
      return;
    }

    if (t.matches("[data-owner-search]")) {
      ui.ownerQ = t.value;
      paintDishList();
      return;
    }

    if (t.matches("[data-table]")) {
      writeJSON(LS_TABLE, { table: t.value.trim() });
      return;
    }

    if (t.matches('[name="image"]')) {
      var prev = ownerHost.querySelector("[data-img-preview]");
      if (prev) {
        prev.innerHTML = t.value
          ? '<img src="' + esc(t.value) + '" alt="">'
          : IC.image + '<span style="margin-left:8px">Фото не выбрано</span>';
      }
    }
  }

  function onChange(e) {
    var t = e.target;

    if (t.matches("[data-img-file]")) {
      var file = t.files && t.files[0];
      if (!file) return;
      if (!/^image\//.test(file.type)) { toast("Это не изображение"); return; }
      var reader = new FileReader();
      reader.onload = function () {
        var img = new Image();
        img.onload = function () {
          var max = 900;
          var k = Math.min(1, max / Math.max(img.width, img.height));
          var canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(img.width * k));
          canvas.height = Math.max(1, Math.round(img.height * k));
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          var out = canvas.toDataURL("image/jpeg", 0.82);
          readDishForm();
          if (!ui.edit) return;
          ui.edit.image = out;
          paintOwnerBody();
          toast("Фото загружено");
        };
        img.onerror = function () { toast("Не удалось прочитать фото"); };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
      return;
    }

    if (t.matches("[data-cat-name]")) {
      var id = t.getAttribute("data-id");
      var val = t.value.trim();
      var c = DATA.categories.find(function (x) { return x.id === id; });
      if (!c) return;
      if (!val) { toast("Название не может быть пустым"); t.value = c.name; return; }
      var dup = DATA.categories.some(function (x) { return x.id !== id && x.name.toLowerCase() === val.toLowerCase(); });
      if (dup) { toast("Такой раздел уже есть"); t.value = c.name; return; }
      c.name = val;
      saveData();
      renderAll();
      paintOwnerBody();
      toast("Раздел переименован");
    }
  }

  function onKey(e) {
    if (e.key === "Escape") {
      if (layer && layer.classList.contains("is-open")) {
        ui.confirm = null;
        closeLayer();
      } else if (ui.owner) {
        closeOwner();
      } else {
        closeSearch();
      }
      return;
    }

    if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("g-card")) {
      e.preventDefault();
      openDish(e.target.getAttribute("data-dish"));
      return;
    }

    if (e.key === "Enter" && e.target.matches && e.target.matches("[data-pin-input]")) {
      e.preventDefault();
      tryPin();
    }
  }

  function onImgError(e) {
    var img = e.target;
    if (!img || img.tagName !== "IMG") return;
    var host = img.parentNode;
    if (!host) return;
    var mono = host.querySelector(".g-mono");
    if (mono) mono.hidden = false;
    img.remove();
  }

  function bind() {
    ROOT.addEventListener("click", onClick);
    ROOT.addEventListener("input", onInput);
    ROOT.addEventListener("change", onChange);
    ROOT.addEventListener("error", onImgError, true);
    document.addEventListener("keydown", onKey);
  }

  function injectFonts() {
    if (document.getElementById("garden-fonts")) return;
    var link = document.createElement("link");
    link.id = "garden-fonts";
    link.rel = "stylesheet";
    link.href = "https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap";
    document.head.appendChild(link);
  }

  /* ---------------- старт ---------------- */

  renderShell();
  bind();
  renderAll();
  injectFonts();
}

gardenBoot();

</script>
</body>
</html>
